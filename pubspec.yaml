name: radhika_dental_app
description: "Radhika Super Speciality Dental Hospital - Clinic Management App"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0
  url_launcher: ^6.3.1
  table_calendar: ^3.2.0
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
